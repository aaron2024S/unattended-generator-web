name: Build and Push Docker Image

# 触发方式：
#   1) push 到 main / master，或打 v* 标签  -> 自动构建并推送
#   2) Actions 页面手动 Run workflow（workflow_dispatch）-> 用于首次验证或补推
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: '手动构建时使用的镜像标签'
        required: false
        default: 'latest'
        type: string

# 推送目标：Docker Hub（https://hub.docker.com/r/<user>/unattended-generator-web）
# 需要两个仓库 Secret（Settings -> Secrets and variables -> Actions）：
#   DOCKERHUB_USERNAME = aaron2024s        <- 必须全小写（Docker Hub 用户名规则）
#   DOCKERHUB_TOKEN    = dckr_pat_xxx      <- Docker Hub 的 Access Token（Read & Write）
env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/unattended-generator-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: 写入构建摘要
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### 镜像已推送到 Docker Hub"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- 拉取: \`docker pull ${{ env.DOCKERHUB_IMAGE }}:latest\`"
            echo "- 架构: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
